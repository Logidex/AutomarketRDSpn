# docker-compose.dev.yml
services:
  db:
    image: postgres:16
    container_name: automarket-db-dev
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"  # Expuesto para DBeaver, pgAdmin, etc.
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: AutoMarket.API/Dockerfile
    container_name: automarket-api-dev
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080

      ConnectionStrings__DefaultConnection: ${CONNECTION_STRING}
      Jwt__Secret: ${JWT_SECRET}
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
      SmtpSettings__Host: ${SMTP_HOST}
      SmtpSettings__Port: ${SMTP_PORT}
      SmtpSettings__User: ${SMTP_USER}
      SmtpSettings__Password: ${SMTP_PASSWORD}
      SmtpSettings__SenderName: ${SMTP_SENDER_NAME}
      AWS__AccessKey: ${AWS_ACCESS_KEY}
      AWS__SecretKey: ${AWS_SECRET_KEY}
      AWS__Region: ${AWS_REGION}
      AWS__BucketName: ${AWS_BUCKET_NAME}
      PayPal__UrlBase: ${PAYPAL_URL_BASE}
      PayPal__ClientId: ${PAYPAL_CLIENT_ID}
      PayPal__ClientSecret: ${PAYPAL_CLIENT_SECRET}
      PayPal__ReturnUrl: ${PAYPAL_RETURN_URL}
      PayPal__CancelUrl: ${PAYPAL_CANCEL_URL}
      PayPal__WebhookId: ${PAYPAL_WEBHOOK_ID}
      Cors__AllowedOrigins: ${CORS_ALLOWED_ORIGINS}

    ports:
      - "8080:8080"  # Expuesto para desarrollo
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata_dev: